name: 每日刷新持仓

# 北京时间 22:07。GitHub 的 cron 走 UTC，22:07 CST = 14:07 UTC。
# 故意不写整点：GitHub 明说整点前后排队最久，定时任务会被推迟到不知道什么时候。
# 只跑周一到周五——国内基金周末不公布净值，跑了也是白跑。
on:
  schedule:
    - cron: '7 14 * * 1-5'
  workflow_dispatch:        # 也可以在 Actions 页手动跑一次

permissions:
  contents: write           # 提交 data/returns.json 需要

# 手动触发和定时撞上时排队而不是互相打断
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 重新生成 data/returns.json
        run: node tools/update-returns.mjs

      # 净值没更新（节假日、接口还没放当天数据）就什么都不做，
      # 免得历史里堆一串只有时间戳变化的提交
      - name: 数字有变化才提交
        run: |
          if git diff --quiet -- data/returns.json; then
            echo "净值没有更新，跳过提交"
            exit 0
          fi
          ASOF=$(node -p "require('./data/returns.json').asOf || '—'")
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/returns.json
          git commit -m "自动刷新持仓推算（净值截至 ${ASOF}）"
          git push
